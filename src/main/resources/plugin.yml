name: AntiAutoTotem
version: 1.0.0
main: com.df15.antiautototem.AntiAutoTotem
api-version: '1.21'
author: Lorealex
description: >
  Mitigates (does not detect) "auto-totem" macros by briefly locking the
  off-hand slot right after a Totem of Undying is consumed.
commands:
  antiautototem:
    description: Reload the AntiAutoTotem configuration
    usage: /antiautototem reload
    permission: antiautototem.admin
permissions:
  antiautototem.admin:
    description: Allows reloading the AntiAutoTotem configuration
    default: op
