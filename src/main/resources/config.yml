# AntiAutoTotem
#
# When a player consumes a Totem of Undying (EntityResurrectEvent), they are
# temporarily blocked from putting ANY item in the off-hand slot. A legitimate
# player takes far longer than this to grab another totem and equip it; an
# auto-totem macro, which usually refills the off-hand in the same tick, loses
# its advantage during this window.
#
# cooldown-ticks: lock duration in game ticks (20 ticks = 1 second).
# Default 6 ticks (~0.3 s): short enough that a normal player never notices it.
cooldown-ticks: 6

# Tell the player (chat) when they try to equip something during the lock.
notify-player: true
notify-message: "&7Wait a moment before re-equipping your off-hand..."
