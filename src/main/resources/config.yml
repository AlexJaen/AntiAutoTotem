# AntiAutoTotem -- ver plugin.yml para el porque de este plugin.
#
# Cuando un jugador consume un totem (EntityResurrectEvent), se le
# bloquea temporalmente meter CUALQUIER item en el slot de la mano
# secundaria (offhand). Un jugador legitimo que reacciona a mano tarda
# de sobra mas que esto en volver a coger un totem del inventario y
# equiparlo; un macro de autototem, que normalmente rellena el offhand
# en el mismo tick, se queda sin efecto durante esta ventana.
#
# cooldown-ticks: duracion del bloqueo en ticks de Minecraft (20 ticks =
# 1 segundo). Por defecto 6 ticks (~0.3s) -- deliberadamente corto para
# que un jugador normal nunca lo note, pero suficiente para anular la
# ventaja de instantaneidad de un macro.
cooldown-ticks: 6

# Si es true, se avisa al jugador en la action bar mientras el
# bloqueo esta activo (solo si de verdad intenta meter algo en el
# offhand durante la ventana -- no se le avisa si no interactua).
notify-player: true
notify-message: "&7Espera un instante antes de re-equipar la mano secundaria..."
